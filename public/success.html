<!DOCTYPE html>
<html lang="fr" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Paiement confirmé — Yonix</title>
<meta name="theme-color" content="#030815">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@700;800&family=Manrope:wght@400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;display:grid;place-items:center;background:#030815;color:#eaf3ff;
  font-family:'Manrope','Segoe UI',sans-serif;
  background-image:radial-gradient(900px 500px at 50% 0,rgba(31,123,255,.18),transparent 60%)}
.card{text-align:center;padding:54px 40px;border-radius:28px;border:1px solid rgba(90,160,255,.28);
  background:linear-gradient(160deg,rgba(31,123,255,.12),rgba(3,8,21,.9));
  box-shadow:0 0 80px -20px rgba(31,123,255,.5);max-width:480px;width:calc(100% - 32px);animation:in .7s cubic-bezier(.2,.9,.25,1)}
@keyframes in{from{opacity:0;transform:translateY(24px) scale(.96)}}
.check{width:72px;height:72px;border-radius:50%;background:linear-gradient(135deg,#22c55e,#15803d);
  display:grid;place-items:center;margin:0 auto 26px;box-shadow:0 0 40px rgba(34,197,94,.5)}
.check svg{width:36px;height:36px;stroke:#fff;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;fill:none}
h1{font-family:'Sora','Segoe UI',sans-serif;font-size:28px;font-weight:800;margin-bottom:12px;
  background:linear-gradient(180deg,#fff,#a6dcff);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
p{color:#8aa4c8;line-height:1.6;font-size:15px;margin-bottom:24px}
.disc{display:inline-flex;align-items:center;gap:10px;padding:12px 20px;border-radius:14px;
  background:rgba(88,101,242,.2);border:1px solid rgba(88,101,242,.5);font-weight:700;font-size:15px;margin-bottom:28px;color:#c9ceff}
.disc svg{width:22px;height:22px;fill:#5865f2}
a.back{display:inline-block;padding:12px 28px;border-radius:14px;border:1px solid rgba(90,160,255,.35);
  text-decoration:none;color:#8aa4c8;font-size:14px;transition:all .25s}
a.back:hover{color:#fff;border-color:#4aa8ff;box-shadow:0 0 20px rgba(31,123,255,.3)}
</style>
</head>
<body>
<div class="card">
  <div class="check"><svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg></div>
  <h1>Paiement confirmé ✓</h1>
  <p>Ton achat a bien été enregistré. Un membre de notre équipe va te contacter sur Discord dans les prochaines minutes pour t'envoyer ta clé.</p>
  <div class="disc">
    <svg viewBox="0 0 127.14 96.36"><path d="M107.7,8.07A105.15,105.15,0,0,0,81.47,0a72.06,72.06,0,0,0-3.36,6.83A97.68,97.68,0,0,0,49,6.83,72.37,72.37,0,0,0,45.64,0,105.89,105.89,0,0,0,19.39,8.09C2.79,32.65-1.71,56.6.54,80.21h0A105.73,105.73,0,0,0,32.71,96.36,77.7,77.7,0,0,0,39.6,85.25a68.42,68.42,0,0,1-10.85-5.18c.91-.66,1.8-1.34,2.66-2a75.57,75.57,0,0,0,64.32,0c.87.71,1.76,1.39,2.66,2a68.68,68.68,0,0,1-10.87,5.19,77,77,0,0,0,6.89,11.1A105.25,105.25,0,0,0,126.6,80.22h0C129.24,52.84,122.09,29.11,107.7,8.07ZM42.45,65.69C36.18,65.69,31,60,31,53s5-12.74,11.43-12.74S54,46,53.89,53,48.84,65.69,42.45,65.69Zm42.24,0C78.41,65.69,73.25,60,73.25,53s5-12.74,11.44-12.74S96.23,46,96.12,53,91.08,65.69,84.69,65.69Z"/></svg>
    Rejoins notre Discord pour recevoir ta clé
  </div>
  <a class="back" href="/">← Retour à la boutique</a>
</div>
</body>
</html>
