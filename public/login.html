<!DOCTYPE html>
<html lang="fr" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Connexion — Yonix</title>
<meta name="theme-color" content="#020c1a">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Bebas+Neue&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#020c1a;--bg2:#030f20;
  --blue:#1a7cff;--blue2:#00c8ff;--cyan:#00e5ff;
  --white:#f0f8ff;--dim:#5f8aaa;
  --line:rgba(0,200,255,.15);
  --disp:'Bebas Neue',system-ui,sans-serif;
  --body:'Space Grotesk','Segoe UI',system-ui,sans-serif;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{
  background:var(--bg);color:var(--white);
  font:400 16px/1.6 var(--body);
  min-height:100dvh;display:flex;flex-direction:column;
  background-image:
    radial-gradient(1000px 700px at 80% -10%,rgba(0,200,255,.08),transparent 55%),
    radial-gradient(800px 600px at -5% 60%,rgba(26,124,255,.1),transparent 55%);
}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;cursor:pointer;border:none;background:none}

/* NAV */
.nav{
  height:64px;display:flex;align-items:center;padding:0 24px;
  border-bottom:1px solid var(--line);
  background:rgba(2,12,26,.7);backdrop-filter:blur(16px);
}
.brand{
  display:flex;align-items:center;gap:10px;
  font:700 1.9rem/1 var(--disp);letter-spacing:.04em;
  background:linear-gradient(90deg,#fff 30%,var(--cyan));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
}

/* MAIN */
main{
  flex:1;display:flex;align-items:center;justify-content:center;
  padding:32px 16px;
}
.card{
  width:min(440px,100%);
  background:var(--bg2);
  border:1px solid var(--line);
  border-radius:20px;
  overflow:hidden;
  box-shadow:0 24px 64px rgba(0,0,0,.5);
}

/* TABS */
.tabs{
  display:grid;grid-template-columns:1fr 1fr;
  border-bottom:1px solid var(--line);
}
.tab{
  padding:16px;text-align:center;font-size:14px;font-weight:600;
  color:var(--dim);cursor:pointer;
  transition:color .2s,background .2s;
  position:relative;
}
.tab:first-child{border-right:1px solid var(--line)}
.tab.active{
  color:var(--white);
  background:rgba(0,200,255,.06);
}
.tab.active::after{
  content:'';position:absolute;bottom:0;left:0;right:0;
  height:2px;background:linear-gradient(90deg,var(--blue),var(--blue2));
}

/* PANELS */
.panels{padding:36px}
.panel{display:none}
.panel.active{display:block}

.card-icon{
  width:48px;height:48px;border-radius:12px;
  background:linear-gradient(135deg,rgba(26,124,255,.2),rgba(0,200,255,.15));
  border:1px solid rgba(0,200,255,.2);
  display:flex;align-items:center;justify-content:center;
  margin-bottom:18px;
}
h1{font-size:1.5rem;font-weight:700;margin-bottom:6px}
.sub{color:var(--dim);font-size:14px;margin-bottom:24px;line-height:1.55}

.field-label{display:block;font-size:12px;font-weight:600;color:var(--dim);text-transform:uppercase;letter-spacing:.06em;margin-bottom:7px}
input[type=email]{
  width:100%;padding:13px 16px;
  background:rgba(255,255,255,.04);
  border:1px solid rgba(0,200,255,.2);
  border-radius:11px;color:var(--white);font:inherit;font-size:15px;
  outline:none;transition:border-color .2s,box-shadow .2s;
}
input[type=email]:focus{
  border-color:var(--blue2);
  box-shadow:0 0 0 3px rgba(0,200,255,.12);
}
input[type=email]::placeholder{color:var(--dim)}

.btn{
  width:100%;margin-top:14px;
  padding:14px 20px;
  background:linear-gradient(135deg,var(--blue),var(--blue2));
  border-radius:11px;font-size:15px;font-weight:600;
  color:#fff;letter-spacing:.02em;
  transition:opacity .2s,transform .15s;
  display:flex;align-items:center;justify-content:center;gap:8px;
}
.btn:hover{opacity:.9}
.btn:active{transform:scale(.98)}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none}

.msg{
  margin-top:14px;padding:12px 15px;border-radius:10px;
  font-size:14px;display:none;line-height:1.45;
}
.msg.ok{background:rgba(74,222,128,.08);border:1px solid rgba(74,222,128,.25);color:#4ade80}
.msg.err{background:rgba(255,70,85,.08);border:1px solid rgba(255,70,85,.25);color:#ff7080}
.msg.show{display:block}

.back-link{margin-top:20px;text-align:center;font-size:13px;color:var(--dim)}
.back-link a{color:var(--blue2)}

/* Spinner */
.spin{
  width:17px;height:17px;border:2px solid rgba(255,255,255,.3);
  border-top-color:#fff;border-radius:50%;
  animation:sp .7s linear infinite;display:none;flex-shrink:0;
}
@keyframes sp{to{transform:rotate(360deg)}}

@media(max-width:480px){
  .panels{padding:24px 20px}
  h1{font-size:1.3rem}
}
</style>
</head>
<body>

<nav class="nav">
  <a class="brand" href="/">
    <svg width="26" height="24" viewBox="360 366 540 504" aria-hidden="true">
      <defs>
        <linearGradient id="yA" gradientUnits="userSpaceOnUse" x1="370" y1="376" x2="640" y2="820"><stop offset="0" stop-color="#fff"/><stop offset=".28" stop-color="#a6dcff"/><stop offset=".55" stop-color="#3fc0ff"/><stop offset="1" stop-color="#0a6cff"/></linearGradient>
        <linearGradient id="yB" gradientUnits="userSpaceOnUse" x1="642" y1="610" x2="891" y2="376"><stop offset="0" stop-color="#7df9ff"/><stop offset="1" stop-color="#0f9fff"/></linearGradient>
      </defs>
      <path fill="url(#yA)" d="M370 376H502L682 611V756L572 860V629Z"/>
      <path fill="url(#yB)" d="M759 376H891L704 605L642 527Z"/>
    </svg>
    YONIX
  </a>
</nav>

<main>
  <div class="card">
    <!-- TABS -->
    <div class="tabs" role="tablist">
      <button class="tab active" role="tab" aria-selected="true" data-tab="login">Se connecter</button>
      <button class="tab" role="tab" aria-selected="false" data-tab="signup">Créer un compte</button>
    </div>

    <div class="panels">
      <!-- LOGIN PANEL -->
      <div class="panel active" id="panel-login">
        <div class="card-icon" aria-hidden="true">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#00c8ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>
          </svg>
        </div>
        <h1>Connexion</h1>
        <p class="sub">Entre ton email — on t'envoie un lien magique. Aucun mot de passe.</p>
        <form id="loginForm" novalidate>
          <label class="field-label" for="loginEmail">Adresse email</label>
          <input type="email" id="loginEmail" name="email" placeholder="toi@exemple.com" autocomplete="email" required>
          <button class="btn" type="submit" id="loginBtn">
            <span id="loginBtnText">Envoyer le lien</span>
            <div class="spin" id="loginSpin"></div>
          </button>
        </form>
        <div class="msg" id="loginMsg"></div>
        <p class="back-link"><a href="/">← Retour à la boutique</a></p>
      </div>

      <!-- SIGNUP PANEL -->
      <div class="panel" id="panel-signup">
        <div class="card-icon" aria-hidden="true">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#00c8ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/>
            <line x1="19" y1="8" x2="19" y2="14"/><line x1="22" y1="11" x2="16" y2="11"/>
          </svg>
        </div>
        <h1>Créer un compte</h1>
        <p class="sub">Aucun mot de passe à retenir. Entre ton email, reçois un lien, et c'est fait.</p>
        <form id="signupForm" novalidate>
          <label class="field-label" for="signupEmail">Adresse email</label>
          <input type="email" id="signupEmail" name="email" placeholder="toi@exemple.com" autocomplete="email" required>
          <button class="btn" type="submit" id="signupBtn">
            <span id="signupBtnText">Créer mon compte</span>
            <div class="spin" id="signupSpin"></div>
          </button>
        </form>
        <div class="msg" id="signupMsg"></div>
        <p class="back-link"><a href="/">← Retour à la boutique</a></p>
      </div>
    </div>
  </div>
</main>

<script>
(function(){
  // ---- Tab switching ----
  const tabs = document.querySelectorAll('.tab');
  const panels = document.querySelectorAll('.panel');

  tabs.forEach(tab => {
    tab.addEventListener('click', () => {
      const target = tab.dataset.tab;
      tabs.forEach(t => { t.classList.toggle('active', t === tab); t.setAttribute('aria-selected', t === tab); });
      panels.forEach(p => p.classList.toggle('active', p.id === 'panel-' + target));
    });
  });

  // ---- Show URL errors ----
  const params = new URLSearchParams(location.search);
  const urlError = params.get('error');
  if(urlError === 'expired') showMsg('loginMsg', 'Ce lien a expiré. Demandes-en un nouveau ci-dessous.', 'err');
  else if(urlError === 'missing') showMsg('loginMsg', 'Lien invalide. Demandes-en un nouveau.', 'err');

  // ---- Form handlers ----
  setupForm('loginForm', 'loginEmail', 'loginBtn', 'loginBtnText', 'loginSpin', 'loginMsg', 'Envoyer le lien');
  setupForm('signupForm', 'signupEmail', 'signupBtn', 'signupBtnText', 'signupSpin', 'signupMsg', 'Créer mon compte');

  function setupForm(formId, inputId, btnId, btnTextId, spinId, msgId, defaultLabel) {
    const form = document.getElementById(formId);
    const input = document.getElementById(inputId);
    const btn = document.getElementById(btnId);
    const btnText = document.getElementById(btnTextId);
    const spin = document.getElementById(spinId);

    form.addEventListener('submit', async function(e) {
      e.preventDefault();
      const email = input.value.trim();
      if(!email) { showMsg(msgId, 'Entre ton adresse email.', 'err'); return; }

      setLoading(true);
      clearMsg(msgId);

      try {
        const r = await fetch('/api/auth/send-link', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({ email })
        });
        const data = await r.json();

        if(r.ok) {
          showMsg(msgId, '✓ Lien envoyé ! Vérifie ta boîte mail (et tes spams).', 'ok');
          input.value = '';
          btn.disabled = true;
          setTimeout(() => { btn.disabled = false; }, 60000);
        } else {
          showMsg(msgId, data.error || 'Erreur lors de l\'envoi.', 'err');
        }
      } catch(err) {
        showMsg(msgId, 'Erreur réseau. Réessaie.', 'err');
      } finally {
        setLoading(false);
      }

      function setLoading(on) {
        btn.disabled = on;
        btnText.textContent = on ? 'Envoi en cours...' : defaultLabel;
        spin.style.display = on ? 'block' : 'none';
      }
    });
  }

  function showMsg(id, text, type) {
    const el = document.getElementById(id);
    if(!el) return;
    el.textContent = text;
    el.className = `msg ${type} show`;
  }

  function clearMsg(id) {
    const el = document.getElementById(id);
    if(el) el.classList.remove('show');
  }
})();
</script>
</body>
</html>
