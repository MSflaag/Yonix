<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>YONIX</title>
<style>
  :root{--cyan:#00c8ff;--blue:#1a6fff;--green:#22c55e;--body:'Inter',sans-serif}
  *{margin:0;padding:0;box-sizing:border-box}
  body{min-height:100vh;background:#0a0a12;color:#fff;font-family:var(--body);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;position:relative;overflow:hidden}
  canvas{position:fixed;inset:0;pointer-events:none;opacity:.4}
  .card{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.1);border-radius:24px;padding:40px;max-width:520px;width:100%;text-align:center;position:relative;z-index:1;backdrop-filter:blur(12px)}
  .icon{width:72px;height:72px;border-radius:50%;background:radial-gradient(circle,rgba(34,197,94,.3),transparent);display:flex;align-items:center;justify-content:center;margin:0 auto 20px;font-size:36px}
  h1{font-size:24px;font-weight:800;margin-bottom:8px;background:linear-gradient(135deg,#4ade80,#22c55e);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
  p{color:rgba(255,255,255,.6);line-height:1.6;margin-bottom:6px;font-size:14px}
  .product-name{font:700 16px var(--body);color:#fff;background:rgba(255,255,255,.06);padding:10px 16px;border-radius:10px;margin:16px 0;display:inline-block}
  .dl-section{margin-top:24px;padding-top:24px;border-top:1px solid rgba(255,255,255,.08)}
  .dl-section h2{font-size:15px;font-weight:700;margin-bottom:14px;color:rgba(255,255,255,.8)}
  .dl-btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:12px 16px;margin-bottom:8px;background:linear-gradient(135deg,#00c8ff,#1a6fff);border:none;border-radius:12px;color:#000;font:700 14px var(--body);cursor:pointer;text-decoration:none;transition:transform .15s,box-shadow .2s}
  .dl-btn:hover{transform:translateY(-2px);box-shadow:0 8px 24px -4px rgba(0,200,255,.4)}
  .discord-info{margin-top:20px;padding:16px;background:rgba(88,101,242,.15);border:1px solid rgba(88,101,242,.3);border-radius:12px}
  .discord-info p{color:rgba(255,255,255,.7)}
  .back{display:inline-block;margin-top:24px;color:rgba(255,255,255,.4);font-size:13px;text-decoration:none;transition:color .2s}
  .back:hover{color:var(--cyan)}
  .loading{color:rgba(255,255,255,.5);font-size:14px;padding:20px 0}
  .err{color:#ff6b6b;font-size:13px;margin-top:12px}
</style>
</head>
<body>
<canvas id="bg"></canvas>
<div class="card">
  <div class="icon">✅</div>
  <h1>Paiement confirmé !</h1>
  <p>Merci pour ta commande sur Yonix.</p>
  <div id="content"><p class="loading">Chargement de ta commande…</p></div>
  <a href="/" class="back">← Retour à la boutique</a>
</div>

<script>
// Particle canvas background
(function(){
  const cv=document.getElementById('bg');
  const cx=cv.getContext('2d');
  let W,H,pts=[];
  function resize(){W=cv.width=innerWidth;H=cv.height=innerHeight;pts=[]}
  function init(){for(let i=0;i<60;i++)pts.push({x:Math.random()*W,y:Math.random()*H,vx:(Math.random()-.5)*.3,vy:(Math.random()-.5)*.3,r:Math.random()*2+1,o:Math.random()*.5+.1})}
  function frame(){
    cx.clearRect(0,0,W,H);
    pts.forEach(p=>{
      p.x+=p.vx;p.y+=p.vy;
      if(p.x<0||p.x>W)p.vx*=-1;
      if(p.y<0||p.y>H)p.vy*=-1;
      cx.beginPath();cx.arc(p.x,p.y,p.r,0,Math.PI*2);
      cx.fillStyle=`rgba(0,200,255,${p.o})`;cx.fill();
    });
    requestAnimationFrame(frame);
  }
  addEventListener('resize',()=>{resize();init()});
  resize();init();frame();
})();

// BUNDLE file list — must match what's in /public/files/
const BUNDLE_FILES=[
  {label:'ChatGPT Unfiltered',file:'chatgpt-unfiltered.zip'},
  {label:'Claude Unrestricted',file:'claude-unrestricted.zip'},
  {label:'Gemini Bypass',file:'gemini-bypass.zip'},
  {label:'Meta AI Jailbreak',file:'meta-ai-jailbreak.zip'},
  {label:'Copilot Override',file:'copilot-override.zip'},
  {label:'Grok Exploit',file:'grok-exploit.zip'},
  {label:'Mistral Uncensored',file:'mistral-uncensored.zip'},
  {label:'Perplexity Bypass',file:'perplexity-bypass.zip'},
  {label:'DeepSeek Exploit',file:'deepseek-exploit.zip'},
  {label:'Llama Jailbreak',file:'llama-jailbreak.zip'},
  {label:'Pi AI Bypass',file:'pi-bypass.zip'},
];

async function loadOrder(){
  const params=new URLSearchParams(location.search);
  const sid=params.get('session_id');
  const el=document.getElementById('content');

  if(!sid){
    el.innerHTML=`<p class="err">Session introuvable. Contacte le support.</p>`;
    return;
  }

  let localMeta = {};
  try {
    const raw = localStorage.getItem('yonix_last_order_' + sid) || localStorage.getItem('yonix_last_order');
    if (raw) localMeta = JSON.parse(raw) || {};
  } catch (e) {}

  let data = null;
  try{
    const res=await fetch('/api/session?session_id='+encodeURIComponent(sid));
    if (res.ok) data=await res.json();
  }catch(e){}

  if (!data && localMeta.productName) {
    data = { status: 'paid', metadata: localMeta };
  }

  if(!data || data.status!=='paid'){
    el.innerHTML=`<p class="err">Paiement non confirmé (statut : ${(data && data.status)||'inconnu'}). Contacte le support.</p>`;
    return;
  }

  const m = { ...localMeta, ...(data.metadata || {}) };
  const isBundle=m.productName&&m.productName.toLowerCase().includes('bundle');
  const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const qtyNum = parseInt(m.quantity || '1', 10) || 1;
  const qtyBadge = qtyNum > 1 ? ` ×${qtyNum}` : '';

  let html=`<div class="product-name">${esc(m.productName||'Produit')}${qtyBadge}${m.tierName?' — '+esc(m.tierName):''}${m.priceRaw?' ('+esc(m.priceRaw)+')':''}</div>`;

  if(m.deliveredProduct){
    html+=`<div class="dl-section">
      <h2>Ton produit livré sur le site</h2>
      <pre style="text-align:left;white-space:pre-wrap;word-break:break-word;background:rgba(0,200,255,.08);border:1px solid rgba(0,200,255,.3);padding:14px;border-radius:10px;color:#fff;font-size:13.5px;margin-bottom:10px">${esc(m.deliveredProduct)}</pre>
    </div>`;
  }

  if(m.downloadFile){
    html+=`<div class="dl-section">
      <h2>Ton fichier est prêt</h2>
      <a class="dl-btn" href="/files/${encodeURIComponent(m.downloadFile)}" download>
        Télécharger ${esc(m.downloadFile)}
      </a>
    </div>`;
  } else if(isBundle){
    html+=`<div class="dl-section">
      <h2>Tes 11 fichiers sont prêts</h2>
      ${BUNDLE_FILES.map(f=>`<a class="dl-btn" href="/files/${encodeURIComponent(f.file)}" download>${esc(f.label)}</a>`).join('')}
    </div>`;
  } else if(!m.deliveredProduct){
    html+=`<div class="discord-info">
      <p><strong>Ta commande est bien enregistrée sur ton compte.</strong></p>
      <p style="margin-top:8px">Ton produit (clé, identifiants ou fichier) te sera envoyé <strong>directement sur le site dans ton espace Mon Compte</strong> dès validation.</p>
      <p style="margin-top:8px;font-size:12px;color:rgba(255,255,255,.4)">Réf. : ${esc(sid.slice(-12))}</p>
    </div>`;
  }

  html+=`<div style="margin-top:18px">
    <a class="dl-btn" href="/profile">Accéder à mes commandes &amp; produits reçus</a>
  </div>`;

  el.innerHTML=html;
}

loadOrder();
</script>
</body>
</html>
